<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manustur - Turismo</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary-color: #1A4F8A;
      --secondary-color: #FFFFFF;
      --button-radius: 22px;
      --font-family: 'Montserrat', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(26, 79, 138, 0.55);
      z-index: -1;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      padding: 60px 30px 40px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px) saturate(140%);
    }

    .logo {
      width: 200px;
      height: 200px;
      margin: 0 auto 25px;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    .slider-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slider-item.active {
      opacity: 1;
    }

    .slider-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      color: var(--primary-color);
      font-size: 38px;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeInUp 1s forwards 0.3s;
    }

    .subtitle {
      font-size: 18px;
      color: #333;
      margin-bottom: 35px;
      opacity: 0;
      animation: fadeInUp 1s forwards 0.5s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1A4F8A, #2A6FB8);
      color: white;
      text-decoration: none;
      padding: 18px 22px;
      border-radius: 22px;
      margin: 14px 0;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(20px);
      animation: buttonFadeIn 0.6s forwards;
    }

    .link-button:nth-child(1){animation-delay:0.7s;}
    .link-button:nth-child(2){animation-delay:0.9s;}
    .link-button:nth-child(3){animation-delay:1.1s;}
    .link-button:nth-child(4){animation-delay:1.3s;}
    .link-button:nth-child(5){animation-delay:1.5s;}
    .link-button:nth-child(6){animation-delay:1.7s;}

    @keyframes buttonFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .link-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
    }

    .socials {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 22px;
      opacity: 0;
      animation: fadeInUp 1s forwards 2s;
    }

    .socials a {
      font-size: 26px;
      color: var(--primary-color);
    }

    footer {
      margin-top: 35px;
      padding-top: 15px;
      border-top: 1px solid rgba(0,0,0,0.15);
      color: #444;
    }

    footer h5 {
      font-size: 14px;
      font-weight: 600;
    }

    footer small {
      font-size: 12px;
    }

    .floating-whatsapp {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      color: white;
      padding: 16px 20px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 999;
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline id="bg-video">
    <source src="fundo.mp4" type="video/mp4">
  </video>

  <div class="container">

    <div class="logo">
      <div class="slider-item active"><img src="logo.jpg"></div>
      <div class="slider-item"><img src="passeio1.jpg"></div>
      <div class="slider-item"><img src="passeio2.jpg"></div>
      <div class="slider-item"><img src="passeio3.jpg"></div>
      <div class="slider-item"><img src="passeio4.jpg"></div>
      <div class="slider-item"><img src="passeio5.jpg"></div>
      <div class="slider-item"><img src="passeio6.jpg"></div>
    </div>

    <h1>ManusTur</h1>
    <p class="subtitle">
      Passeios turísticos em São Luís, Alcântara, Raposa, São José de Ribamar e Lençóis Maranhenses.
    </p>

    <div class="links-group">
      <a href="https://wa.me/559888065720" class="link-button">
        <i class="fab fa-whatsapp"></i> Atendimento WhatsApp
      </a>

      <a href="mailto:gildoturismo@hotmail.com" class="link-button">
        <i class="fas fa-envelope"></i> E-mail
      </a>

      <a href="https://manustur.netlify.app" class="link-button">
        <i class="fas fa-globe"></i> Site Oficial
      </a>

      <a href="https://instagram.com/manusturismo" class="link-button">
        <i class="fab fa-instagram"></i> Instagram
      </a>

      <a href="portfolio.pdf" target="_blank" class="link-button">
        <i class="fas fa-briefcase"></i> Portfólio
      </a>

      <a href="https://wa.me/559888065720" class="link-button">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
    </div>

    <div class="socials">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
    </div>

    <footer>
      <h5>© 2026 ManusTur • Todos os direitos reservados</h5>
      <small>
        Desenvolvido por 
        <a href="https://dk7web.netlify.app" target="_blank" style="color:#c9a227; text-decoration:none; font-weight:600;">
          DK7
        </a>
      </small>
    </footer>

  </div>

  <a href="https://wa.me/559888065720" class="floating-whatsapp">
    <i class="fab fa-whatsapp"></i> Atendimento
  </a>

  <script>
    const slides = document.querySelectorAll('.slider-item');
    let currentSlide = 0;

    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 3000);
  </script>

</body>
</html>
